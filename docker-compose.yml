services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novascale}
      POSTGRES_USER: ${POSTGRES_USER:-novascale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novascale_local_change_me}

      APP_DB_USER: ${APP_DB_USER:-novascale_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-novascale_app_local_change_me}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-novascale} -d ${POSTGRES_DB:-novascale}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped


  migrate:
    build:
      context: .
      target: development

    command:
      - alembic
      - upgrade
      - head

    environment:
      APP_NAME: ${APP_NAME:-NovaScale API}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://novascale_app:novascale_app_local_change_me@postgres:5432/novascale}

      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://novascale:novascale_local_change_me@postgres:5432/novascale}

      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}

    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  backend:
    build:
      context: .
      target: development

    environment:
      APP_NAME: ${APP_NAME:-NovaScale API}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}

      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://novascale_app:novascale_app_local_change_me@postgres:5432/novascale}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-30}

      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      JWT_ISSUER: ${JWT_ISSUER:-novascale}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-novascale-api}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}

      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost","127.0.0.1","testserver"]}'
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-[]}'
      HSTS_ENABLED: ${HSTS_ENABLED:-false}

      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-ollama}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-qwen2.5:3b}
      AI_OLLAMA_TIMEOUT_SECONDS: ${AI_OLLAMA_TIMEOUT_SECONDS:-360}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-ollama}
      AI_OLLAMA_EMBEDDING_MODEL: ${AI_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      AI_DOCUMENT_STORAGE_ROOT: ${AI_DOCUMENT_STORAGE_ROOT:-./storage}

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  outbox-worker:
    build:
      context: .
      target: development

    command:
      - python
      - -m
      - app.workers.outbox

    environment:
      APP_NAME: ${APP_NAME:-NovaScale API}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://novascale_app:novascale_app_local_change_me@postgres:5432/novascale}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-30}

      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      JWT_ISSUER: ${JWT_ISSUER:-novascale}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-novascale-api}

      OUTBOX_WORKER_POLL_INTERVAL_SECONDS: ${OUTBOX_WORKER_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
      OUTBOX_WORKER_MAX_ATTEMPTS: ${OUTBOX_WORKER_MAX_ATTEMPTS:-5}
      OUTBOX_WORKER_RETRY_BASE_SECONDS: ${OUTBOX_WORKER_RETRY_BASE_SECONDS:-30}
      OUTBOX_WORKER_RETRY_MAX_SECONDS: ${OUTBOX_WORKER_RETRY_MAX_SECONDS:-900}
      OUTBOX_WORKER_LEASE_SECONDS: ${OUTBOX_WORKER_LEASE_SECONDS:-300}

      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-ollama}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-qwen2.5:3b}
      AI_OLLAMA_TIMEOUT_SECONDS: ${AI_OLLAMA_TIMEOUT_SECONDS:-360}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-ollama}
      AI_OLLAMA_EMBEDDING_MODEL: ${AI_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      AI_DOCUMENT_STORAGE_ROOT: ${AI_DOCUMENT_STORAGE_ROOT:-./storage}

    volumes:
      - ./app:/app/app

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  notification-worker:
    build:
      context: .
      target: development

    command:
      - python
      - -m
      - app.workers.notifications

    environment:
      APP_NAME: ${APP_NAME:-NovaScale API}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://novascale_app:novascale_app_local_change_me@postgres:5432/novascale}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-30}

      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      JWT_ISSUER: ${JWT_ISSUER:-novascale}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-novascale-api}

      NOTIFICATION_WORKER_POLL_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_POLL_INTERVAL_SECONDS:-2}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-50}
      NOTIFICATION_WORKER_MAX_ATTEMPTS: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:-3}
      NOTIFICATION_WORKER_RETRY_BASE_SECONDS: ${NOTIFICATION_WORKER_RETRY_BASE_SECONDS:-30}
      NOTIFICATION_WORKER_RETRY_MAX_SECONDS: ${NOTIFICATION_WORKER_RETRY_MAX_SECONDS:-900}

    volumes:
      - ./app:/app/app

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
