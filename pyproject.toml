[project]
name = "novascale"
version = "0.1.0"
description = "Production-grade B2B shipping and logistics SaaS platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.0,<2.0.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi[standard]>=0.141.1,<0.142.0",
    "httpx>=0.28.1,<1.0.0",
    "langchain-core>=1.6.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.4,<0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
exclude = ["migrations/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that require external infrastructure such as PostgreSQL",
    "external_ai: tests that require a running external AI runtime such as Ollama",
]
asyncio_mode = "auto"
pythonpath = ["."]
