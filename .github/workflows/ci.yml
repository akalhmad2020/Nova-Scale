name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      AUTH_JWT_SECRET: "ci-only-jwt-secret-do-not-use-in-production-0123456789abcdef"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app tests

      - name: Unit tests
        run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: novascale_test
          POSTGRES_USER: novascale
          POSTGRES_PASSWORD: novascale_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novascale -d novascale_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      AUTH_JWT_SECRET: "ci-only-jwt-secret-do-not-use-in-production-0123456789abcdef"
      DATABASE_URL: postgresql+asyncpg://novascale:novascale_test_password@127.0.0.1:5432/novascale_test
      TEST_DATABASE_URL: postgresql+asyncpg://novascale:novascale_test_password@127.0.0.1:5432/novascale_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m "integration and not external_ai"

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --target production -t novascale:${{ github.sha }} .

      - name: Smoke test production image
        run: |
          docker run --rm \
            --entrypoint sh \
            -e APP_ENV=test \
            -e AUTH_JWT_SECRET='ci-only-jwt-secret-do-not-use-in-production-0123456789abcdef' \
            -e DATABASE_URL='postgresql+asyncpg://user:pass@localhost:5432/db' \
            novascale:${{ github.sha }} \
            -c 'python -c "import app.main; print(\"production image import: ok\")"'
            