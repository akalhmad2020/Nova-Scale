name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      AUTH_JWT_SECRET: "ci-only-jwt-secret-do-not-use-in-production-0123456789abcdef"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app tests

      - name: AI hardening tests
        run: uv run pytest tests/unit/ai/test_runtime_hardening.py tests/unit/ai/agent/test_prompt_injection_hardening.py

      - name: Unit tests
        run: uv run pytest -m "not integration"

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend production build
        run: npm run build

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: novascale_test
          POSTGRES_USER: novascale
          POSTGRES_PASSWORD: novascale_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novascale -d novascale_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      AUTH_JWT_SECRET: "ci-only-jwt-secret-do-not-use-in-production-0123456789abcdef"

      POSTGRES_DB: novascale_test
      POSTGRES_USER: novascale
      POSTGRES_PASSWORD: novascale_test_password

      APP_DB_USER: novascale_app
      APP_DB_PASSWORD: novascale_app_test_password

      MIGRATION_DATABASE_URL: postgresql+asyncpg://novascale:novascale_test_password@127.0.0.1:5432/novascale_test
      DATABASE_URL: postgresql+asyncpg://novascale_app:novascale_app_test_password@127.0.0.1:5432/novascale_test
      TEST_DATABASE_URL: postgresql+asyncpg://novascale_app:novascale_app_test_password@127.0.0.1:5432/novascale_test
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://novascale:novascale_test_password@127.0.0.1:5432/novascale_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Create runtime database role
        env:
          PGPASSWORD: novascale_test_password
        run: |
          psql \
            -h 127.0.0.1 \
            -U novascale \
            -d novascale_test \
            -v ON_ERROR_STOP=1 \
            -c "DO \$\$
                BEGIN
                  IF NOT EXISTS (
                    SELECT 1
                    FROM pg_roles
                    WHERE rolname = 'novascale_app'
                  ) THEN
                    CREATE ROLE novascale_app
                      LOGIN
                      PASSWORD 'novascale_app_test_password'
                      NOSUPERUSER
                      NOCREATEDB
                      NOCREATEROLE
                      NOINHERIT
                      NOBYPASSRLS;
                  END IF;
                END
                \$\$;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Grant runtime database privileges
        env:
          PGPASSWORD: novascale_test_password
        run: |
          psql \
            -h 127.0.0.1 \
            -U novascale \
            -d novascale_test \
            -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT ON DATABASE novascale_test TO novascale_app;" \
            -c "GRANT USAGE ON SCHEMA public TO novascale_app;" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO novascale_app;" \
            -c "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO novascale_app;" \
            -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO novascale_app;" \
            -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO novascale_app;"

      - name: Integration tests
        run: uv run pytest -m "integration and not external_ai"

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --target production -t novascale:${{ github.sha }} .

      - name: Smoke test production image
        run: |
          docker run --rm \
            --entrypoint sh \
            -e APP_ENV=test \
            -e AUTH_JWT_SECRET='ci-only-jwt-secret-do-not-use-in-production-0123456789abcdef' \
            -e DATABASE_URL='postgresql+asyncpg://user:pass@localhost:5432/db' \
            novascale:${{ github.sha }} \
            -c 'python -c "import app.main; print(\"production image import: ok\")"'
